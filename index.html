<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MATI FOOD COURT</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =====================================================
         MAIN APP
         ===================================================== -->

    <main class="app">

        <!-- Header -->
        <header class="app-header">

            <div class="brand-header">
                <span class="brand-header-main">MATI</span>
                <span class="brand-header-sub">FOOD COURT</span>
            </div>

            <div class="view-label" id="viewLabel">
                OUR STALLS
            </div>

        </header>


        <!-- =================================================
             CAROUSEL AREA
             ================================================= -->

        <section
            class="carousel-area"
            id="carousel"
            aria-label="MATI Food Court Carousel">

            <div class="carousel-viewport">

                <div
                    class="carousel-track"
                    id="carouselTrack">
                </div>

            </div>


            <!-- Previous / Next -->
            <div class="carousel-nav">

                <button
                    type="button"
                    class="carousel-arrow carousel-prev"
                    aria-label="Previous">
                    &#10094;
                </button>

                <button
                    type="button"
                    class="carousel-arrow carousel-next"
                    aria-label="Next">
                    &#10095;
                </button>

            </div>


            <!-- Progress -->
            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </section>


        <!-- =================================================
             DOTS
             ================================================= -->

        <div
            class="dots-container"
            id="dotsContainer">
        </div>


        <!-- =================================================
             BOTTOM NAVIGATION
             ================================================= -->

        <nav class="bottom-nav">

            <!-- Stalls -->
            <button
                class="nav-item active"
                id="stallsNav"
                type="button"
                onclick="showSection('stalls')">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16v2H4V4zm1 4h14l1 12H4L5 8zm4 2v8h2v-8H9zm4 0v8h2v-8h-2z"/>
                </svg>

                <span>Stalls</span>

            </button>


            <!-- Menu -->
            <button
                class="nav-item"
                id="menuNav"
                type="button"
                onclick="showSection('menu')">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8.1 13.34 3.91 9.16a4.95 4.95 0 0 1 0-5.66l7.02 7.02-2.83 2.82zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.09-6.11.82-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.89l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
                </svg>

                <span>Menu</span>

            </button>


            <!-- About -->
            <button
                class="nav-item"
                id="aboutNav"
                type="button"
                onclick="showSection('about')">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>

                <span>About Us</span>

            </button>

        </nav>

    </main>


    <!-- =====================================================
         MENU LIGHTBOX
         ===================================================== -->

    <div
        class="menu-lightbox"
        id="menuLightbox"
        aria-hidden="true">

        <button
            class="menu-lightbox-close"
            type="button"
            onclick="closeMenuImage()"
            aria-label="Close menu">
            &#10005;
        </button>

        <div class="lightbox-content">

            <div
                class="lightbox-title"
                id="lightboxTitle">
            </div>

            <img
                id="largeMenuImage"
                src=""
                alt="Food Menu">

        </div>

    </div>


    <!-- =====================================================
         ABOUT PANEL
         ===================================================== -->

    <section
        class="about-panel"
        id="aboutPanel">

        <div class="panel-inner">

            <div class="panel-header">

                <div>
                    <span class="panel-eyebrow">MATI</span>
                    <h2>About Us</h2>
                </div>

                <button
                    class="close-panel"
                    type="button"
                    onclick="closePanels()"
                    aria-label="Close">
                    &#10005;
                </button>

            </div>


            <div class="about-card">

                <div class="about-logo-wrap">

                    <img
                        class="about-foodcourt-logo"
                        src="TENANT MENU/FOOD COURT NAME.png"
                        alt="MATI Food Court">

                </div>


                <p>
                    Discover popular Filipino food brands in one
                    convenient place.
                </p>

                <p>
                    Browse different brands, view their menus,
                    and easily find the food you are looking for.
                </p>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
